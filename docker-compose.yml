services:
  job-monitor:
    build: .
    image: job-monitor:latest   # tag also used by portainer-stack.yml
    container_name: the-quiet-quitter
    restart: unless-stopped
    ports:
      - "31361:31361"          # put a reverse proxy or tunnel in front of this port
    environment:
      TZ: America/Toronto
      PORT: "31361"
      JM_USER: ${JM_USER:-}    # set both in .env to require a login (strongly recommended behind a tunnel)
      JM_PASS: ${JM_PASS:-}
      CROWDSEC_URL: ${CROWDSEC_URL:-}
      CROWDSEC_KEY: ${CROWDSEC_KEY:-}
      JM_USERS: ${JM_USERS:-}  # more logins later: "alice:pw1,bob:pw2"
    volumes:
      - ./data:/data   # seen.db, track.json, site/, mail.env: back this folder up
    read_only: true
    tmpfs:
      - /tmp:size=400m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,sys,urllib.request as u;sys.exit(0 if u.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/healthz',timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
